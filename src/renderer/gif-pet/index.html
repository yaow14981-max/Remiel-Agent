<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
  }
  #pet-img {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    image-rendering: auto;
  }
</style>
</head>
<body>
<img id="pet-img" src="01.gif" alt="Remiel" draggable="false" />

<script>
(async function() {
  const img = document.getElementById('pet-img');

  // ── Animation config ──
  const ANIM = {
    '01.gif': { duration: 1190 },
    '02.gif': { duration: 1190 },
    '03.gif': { duration: 2170 },
    '04.gif': { duration: 2870 },
    '05.gif': { duration: 2870 },
    '06.gif': { duration: 4270 },
  };
  const IDLE_GIF = '01.gif';
  const IDLE_ALT = '02.gif';
  let currentGif = IDLE_GIF;
  let reactionTimer = null;
  let isIdle = true;
  let idleSwitchTimer = null;

  function setGif(src) {
    if (reactionTimer) { clearTimeout(reactionTimer); reactionTimer = null; }
    if (idleSwitchTimer) { clearTimeout(idleSwitchTimer); idleSwitchTimer = null; }
    currentGif = src;
    img.src = src;
    isIdle = (src === IDLE_GIF || src === IDLE_ALT);
  }

  function playReaction(gif) {
    if (!ANIM[gif]) return;
    img.src = gif + '?t=' + Date.now();
    isIdle = false;
    if (reactionTimer) clearTimeout(reactionTimer);
    reactionTimer = setTimeout(() => {
      setGif(IDLE_GIF);
      scheduleIdleSwitch();
    }, ANIM[gif].duration);
  }

  function scheduleIdleSwitch() {
    if (idleSwitchTimer) clearTimeout(idleSwitchTimer);
    const delay = 8000 + Math.random() * 7000;
    idleSwitchTimer = setTimeout(() => {
      if (!isIdle) return;
      const next = currentGif === IDLE_GIF ? IDLE_ALT : IDLE_GIF;
      setGif(next);
      scheduleIdleSwitch();
    }, delay);
  }

  // ── Drag + Click via pointer events ──
  let ptrPrev = { x: 0, y: 0 };
  let downTime = 0;
  let hasMoved = false;

  document.body.addEventListener('pointerdown', (e) => {
    ptrPrev = { x: e.clientX, y: e.clientY };
    downTime = Date.now();
    hasMoved = false;
    document.body.setPointerCapture(e.pointerId);
  });

  document.body.addEventListener('pointermove', (e) => {
    if (!document.body.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - ptrPrev.x;
    const dy = e.clientY - ptrPrev.y;
    ptrPrev = { x: e.clientX, y: e.clientY };
    if (!hasMoved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
      hasMoved = true;
    }
    if (hasMoved && window.gifPet) {
      window.gifPet.moveBy(dx, dy);
    }
  });

  document.body.addEventListener('pointerup', (e) => {
    const elapsed = Date.now() - downTime;
    if (!hasMoved && elapsed < 300) {
      handleClick();
    }
    document.body.releasePointerCapture(e.pointerId);
  });

  // ── Click → reaction ──
  let clickTimer = null;
  function handleClick() {
    if (clickTimer) {
      clearTimeout(clickTimer);
      clickTimer = null;
      playReaction('04.gif');
    } else {
      clickTimer = setTimeout(() => {
        clickTimer = null;
        playReaction('06.gif');
      }, 300);
    }
  }

  // ── Context menu (IPC from main process) ──
  if (window.gifPet && window.gifPet.onContextMenuAction) {
    window.gifPet.onContextMenuAction((action) => {
      switch (action) {
        case 'idle': setGif(IDLE_GIF); scheduleIdleSwitch(); break;
        case 'react_1': playReaction('02.gif'); break;
        case 'react_2': playReaction('03.gif'); break;
        case 'react_3': playReaction('04.gif'); break;
        case 'react_4': playReaction('05.gif'); break;
        case 'react_5': playReaction('06.gif'); break;
      }
    });
  }

  // ── Start ──
  scheduleIdleSwitch();
  console.log('[GIF-Pet] Ready');
})();
</script>
</body>
</html>
